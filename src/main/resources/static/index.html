<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CollabStudy - Next Gen Learning Space</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app" class="app-container">
        <!-- Auth View -->
        <div id="auth-view" class="view active-view glass-panel">
            <div class="auth-box">
                <div class="brand">
                    <span class="logo-icon">🪐</span>
                    <h1>CollabStudy</h1>
                </div>
                <p class="subtitle">Join the galaxy of learners.</p>
                
                <div class="tabs">
                    <button id="tab-login" class="active" onclick="switchAuthTab('login')">Log In</button>
                    <button id="tab-register" onclick="switchAuthTab('register')">Register</button>
                </div>

                <form id="auth-form" onsubmit="handleAuth(event)">
                    <div class="input-group" id="name-group" style="display: none;">
                        <label for="name">Name</label>
                        <input type="text" id="name" placeholder="Astronaut John">
                    </div>
                    <div class="input-group">
                        <label for="email">Email address</label>
                        <input type="email" id="email" required placeholder="john@space.com">
                    </div>
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="primary-btn">Enter Universe <span class="arrow">→</span></button>
                    <div id="auth-error" class="error-msg"></div>
                </form>
            </div>
        </div>

        <!-- Dashboard View -->
        <div id="dashboard-view" class="view">
            <nav class="sidebar glass-panel">
                <div class="brand-small">
                    <span class="logo-icon">🪐</span>
                    <h2>CollabStudy</h2>
                </div>
                <div class="nav-links">
                    <a href="#" class="active" onclick="showDashboardSection('rooms')">Study Rooms</a>
                </div>
                <div class="user-profile">
                    <div class="avatar"></div>
                    <div class="user-info">
                        <span id="display-name">Loading...</span>
                        <button onclick="logout()" class="logout-btn">Log out</button>
                    </div>
                </div>
            </nav>
            
            <main class="main-content">
                <!-- Rooms Section -->
                <section id="rooms-section" class="content-section active-section">
                    <header class="section-header">
                        <h2>Explore Study Rooms</h2>
                        <button class="primary-btn" onclick="openCreateRoomModal()">+ New Room</button>
                    </header>
                    <div id="rooms-grid" class="grid">
                        <!-- Dynamic Rooms -->
                    </div>
                </section>

                <!-- Room Detail View -->
                <section id="room-detail-section" class="content-section">
                    <header class="section-header">
                        <div>
                            <h2 id="room-detail-title">Room Name</h2>
                            <span id="room-detail-topic" class="badge">Topic</span>
                        </div>
                        <button class="secondary-btn" onclick="showDashboardSection('rooms')">← Exit Room</button>
                    </header>
                    <div class="room-workspace">
                        <div class="chat-container glass-panel">
                            <div class="chat-header">Live Chat System</div>
                            <div id="chat-messages" class="chat-messages">
                                <!-- Messages -->
                            </div>
                            <form id="chat-form" onsubmit="sendChatMessage(event)" class="chat-input-area">
                                <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off">
                                <button type="submit" class="send-btn">Send</button>
                            </form>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>
    
    <!-- Modals -->
    <div class="modal" id="create-room-modal">
        <div class="modal-content glass-panel">
            <h3>Create a Study Room</h3>
            <input type="text" id="room-name" placeholder="Room Name (e.g. Physics 101)" class="full-width">
            <input type="text" id="room-topic" placeholder="Topic (Optional)" class="full-width">
            <div class="modal-actions">
                <button class="secondary-btn" onclick="closeModals()">Cancel</button>
                <button class="primary-btn" onclick="createRoom()">Launch Space</button>
            </div>
        </div>
    </div>

    <!-- SockJS and Stomp for WebSockets -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
